[package]
name = "mailapp-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
mailapp-core.workspace = true

# SQLCipher on Apple's CommonCrypto.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher", "fallible_uint"] }

# Elsewhere SQLCipher needs OpenSSL, which Windows lacks: build it from source (needs Perl).
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl", "fallible_uint"] }

[dev-dependencies]
tempfile = "3.27.0"
