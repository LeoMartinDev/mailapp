[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/application",
    "crates/domain",
    "crates/entrypoints/ui",
    "crates/infrastructure/imap",
    "crates/infrastructure/sqlite",
    "crates/mail-render",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
mailapp-application = { path = "crates/application" }
mailapp-domain = { path = "crates/domain" }
mailapp-imap = { path = "crates/infrastructure/imap" }
mailapp-mail-render = { path = "crates/mail-render" }
mailapp-sqlite = { path = "crates/infrastructure/sqlite" }
mailapp-ui = { path = "crates/entrypoints/ui" }
