[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/infrastructure/imap",
    "crates/infrastructure/sqlite",
    "crates/mail-render",
    "crates/mailapp",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Zed's ui and theme are not on crates.io and build on the gpui of their own repo, so all four come
# from Zed's repo, pinned to the commit of its stable release v1.26.2.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c4273271092b0287f7d181f616bd5171e0a2f70c" }
# macOS: font-kit is the real text system (without it no text is drawn); runtime_shaders compiles the
# Metal shaders at launch, so building needs no Metal Toolchain (a separate download since Xcode 26).
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c4273271092b0287f7d181f616bd5171e0a2f70c", features = ["font-kit", "runtime_shaders"] }
mailapp-core = { path = "crates/core" }
mailapp-imap = { path = "crates/infrastructure/imap" }
mailapp-mail-render = { path = "crates/mail-render" }
mailapp-sqlite = { path = "crates/infrastructure/sqlite" }
mailapp-ui = { path = "crates/ui" }
theme = { git = "https://github.com/zed-industries/zed", rev = "c4273271092b0287f7d181f616bd5171e0a2f70c" }
unicode-segmentation = "1.13.3"
zed_ui = { git = "https://github.com/zed-industries/zed", rev = "c4273271092b0287f7d181f616bd5171e0a2f70c", package = "ui" }
