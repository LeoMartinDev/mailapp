<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>A3 Matière — Conversation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;display=swap">
<style>
body{margin:0}
.app{--text:#18181B;--text2:#5F5F68;--acc:#2F6FEB;--accText:#2962CF;--line:rgba(16,24,40,.08)}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:default}
input{font:inherit;color:inherit;margin:0}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ell{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* three levels only: flat frame, raised panels, max relief for the selection and Send */
.slab{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(247,248,251,.9));-webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);box-shadow:inset 0 1px 0 #FFFFFF,inset 0 -2px 0 rgba(16,24,40,.035),0 0 0 1px rgba(16,24,40,.07),0 2px 0 rgba(16,24,40,.045),0 18px 40px -14px rgba(16,24,40,.22)}
.chip{background:linear-gradient(180deg,#FFFFFF,#F5F6F9);box-shadow:inset 0 1px 0 #FFFFFF,0 0 0 1px rgba(16,24,40,.08),0 1px 0 rgba(16,24,40,.08),0 4px 10px -5px rgba(16,24,40,.16)}
.well{background:rgba(16,24,40,.045);box-shadow:inset 0 1px 2px rgba(16,24,40,.09),inset 0 0 0 1px rgba(16,24,40,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:500;flex:none;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.ghost{box-shadow:inset 0 0 0 1px rgba(16,24,40,.11)}
.ghost:hover{background:linear-gradient(180deg,#FFFFFF,#F5F6F9);box-shadow:inset 0 1px 0 #FFFFFF,0 0 0 1px rgba(16,24,40,.08),0 1px 0 rgba(16,24,40,.08),0 4px 10px -5px rgba(16,24,40,.16);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.pri{background:linear-gradient(180deg,#3170E6,#265DCB);color:#FFFFFF;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px #2459C4,0 2px 0 #1E4CA8,0 8px 16px -8px rgba(47,111,235,.7)}
.pri:hover{transform:translateY(-1px)}
.pri:active{transform:translateY(1px);box-shadow:inset 0 1px 2px rgba(0,0,0,.2),0 0 0 1px #2459C4}
.ib{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;color:var(--text2);flex:none;transition:background .15s,color .15s}
.ib:hover{background:rgba(16,24,40,.06);color:var(--text)}
.bar{display:inline-flex;align-items:center;height:32px;border-radius:10px;overflow:hidden;flex:none}
.bb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;font-size:12.5px;font-weight:500;transition:background .15s}
.bb:hover{background:rgba(16,24,40,.05)}
.bb:active{background:rgba(16,24,40,.09)}
.bb .k{color:var(--text2);font-size:11.5px}
.dv{width:1px;height:16px;background:rgba(16,24,40,.1);flex:none}
.sheet{position:relative;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;border-radius:13px;text-align:left;background:linear-gradient(180deg,#FFFFFF,#F7F8FB);box-shadow:inset 0 1px 0 #FFFFFF,0 0 0 1px rgba(16,24,40,.07),0 2px 0 rgba(16,24,40,.04),0 8px 16px -12px rgba(16,24,40,.3);transition:margin .34s cubic-bezier(.2,.8,.2,1),transform .2s ease}
button.sheet:hover{transform:translateY(-1px)}
.av{display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:600;color:var(--text2);flex:none}
@keyframes rin1{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes unfold{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</helmet>
<div class="app" style="position: relative; height: 100vh; min-height: 760px; overflow: hidden; background: #EEF0F5; color: var(--text); font-family: Inter, 'Segoe UI Variable Text', system-ui, -apple-system, sans-serif; font-optical-sizing: auto; font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased">

<span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(155deg, #D6E2FB 0%, #EDF0F7 50%, #E3E0F5 100%)"></span>
<svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.08; mix-blend-mode: multiply; pointer-events: none"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>

<div style="position: relative; display: flex; height: 100%; box-sizing: border-box; padding: 10px">
<main class="slab" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; animation: rin1 .42s cubic-bezier(.2,.8,.2,1) both">
<div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 14px 14px 4px 18px; flex: none">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding-right: 8px; flex: none">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 7px; background: {{acctColor}}; color: #FFFFFF; font-size: 11px; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 1px 2px rgba(16,24,40,.2)">{{acctShort}}</span>
<span style="font-size: 13.5px; font-weight: 600">{{acctName}}</span>
</span>
<div role="toolbar" aria-label="Actions sur la conversation" class="bar chip">
<button class="bb"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="m5 12 5 5L20 7"></path></svg>Archiver<span class="k">E</span></button>
<span class="dv" aria-hidden="true"></span>
<button class="bb"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2"></path></svg>Reporter<span class="k">H</span></button>
<span class="dv" aria-hidden="true"></span>
<button class="bb"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 5 5v6"></path></svg>Répondre<span class="k">R</span></button>
</div>
<span style="flex-grow: 1"></span>
<button class="ib" aria-label="Imprimer" title="Imprimer · ⌘P"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"></path></svg></button>
<button class="ib" aria-label="Afficher dans la fenêtre principale" title="Afficher dans la fenêtre principale"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM8 5v14M14 5v14"></path></svg></button>
</div>

<div style="flex: 1 1 auto; overflow: auto">
<article style="max-width: 680px; margin: 0 auto; box-sizing: border-box; padding: 18px 36px 28px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
<h1 style="margin: 0; font-size: 27px; font-weight: 650; line-height: 1.16; letter-spacing: -0.024em">{{r.subject}}</h1>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text2)">
<span>{{r.count}}</span>
<span aria-hidden="true">·</span>
<span>{{r.people}}</span>
</div>
</header>

<section aria-label="Résumé par Claude" class="well" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; border-radius: 14px">
<div style="display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--accText)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M12 3c.6 4.6 3.9 8 8.5 9-4.6.6-7.9 3.9-8.5 8.5-.6-4.6-3.9-7.9-8.5-8.5C8.1 11 11.4 7.6 12 3z"></path></svg>Résumé par Claude</div>
<p style="margin: 0; font-size: 14px; line-height: 1.55">{{r.summary}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{r.actions}}" as="a" hint-placeholder-count="2"><button class="btn ghost">{{a.label}}</button></sc-for>
</div>
</section>

<div style="display: flex; flex-direction: column">
<sc-for list="{{r.earlier}}" as="m" hint-placeholder-count="2">
<button class="sheet" aria-expanded="{{m.expanded}}" onClick="{{m.toggle}}" style="z-index: {{m.z}}; margin: 0 {{m.inset}}px {{m.gap}}px; padding: 11px 16px {{m.padB}}px">
<span style="display: flex; align-items: center; gap: 10px; width: 100%">
<span class="av well" aria-hidden="true" style="width: 22px; height: 22px; font-size: 9px">{{m.ini}}</span>
<span style="flex: none; font-weight: 600">{{m.from}}</span>
<span class="ell" style="flex: 1 1 auto; color: var(--text2); opacity: {{m.snipOp}}">{{m.snippet}}</span>
<span style="flex: none; font-size: 12px; color: var(--text2)">{{m.when}}</span>
</span>
<sc-if value="{{m.isOpen}}" hint-placeholder-val="{{false}}">
<span style="display: flex; flex-direction: column; gap: 8px; padding-left: 32px; font-size: 14px; line-height: 1.6; animation: unfold .3s ease both">
<sc-for list="{{m.body}}" as="p" hint-placeholder-count="2"><span>{{p.text}}</span></sc-for>
</span>
</sc-if>
</button>
</sc-for>
<div class="sheet" style="z-index: 10; padding: 18px 20px 20px">
<div style="display: flex; align-items: center; gap: 10px">
<span class="av well" aria-hidden="true" style="width: 32px; height: 32px; font-size: 11px">{{r.ini}}</span>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 600">{{r.from}}</span>
<span class="ell" style="font-size: 12px; color: var(--text2)">à {{r.to}}</span>
</div>
<span style="flex: none; font-size: 12px; color: var(--text2)">{{r.when}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 6px; font-size: 14.5px; line-height: 1.65">
<sc-for list="{{r.body}}" as="p" hint-placeholder-count="3"><p style="margin: 0">{{p.text}}</p></sc-for>
</div>
<button class="btn ghost" style="align-self: flex-start; height: 44px; margin-top: 6px; padding: 0 14px 0 8px; border-radius: 12px; gap: 10px"><span class="well" aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; font-size: 9px; font-weight: 700; color: var(--text2)">PDF</span><span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3"><span>{{r.attach}}</span><span style="font-size: 11.5px; color: var(--text2); font-weight: 400">{{r.attachSize}}</span></span></button>
</div>
</div>
</article>
</div>

<div style="flex: none; padding: 10px 14px 14px">
<div style="max-width: 680px; margin: 0 auto">
<div class="well" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 7px 0 16px; border-radius: 14px">
<label class="sr" for="rp">Répondre</label>
<input id="rp" type="text" placeholder="Répondre à {{r.from}}…" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; padding: 0; background: transparent; font-size: 13.5px">
<button class="btn ghost"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 13px; height: 13px; color: var(--accText)"><path d="M12 3c.6 4.6 3.9 8 8.5 9-4.6.6-7.9 3.9-8.5 8.5-.6-4.6-3.9-7.9-8.5-8.5C8.1 11 11.4 7.6 12 3z"></path></svg>Rédiger avec Claude</button>
<button class="btn pri" aria-label="Envoyer" style="width: 34px; padding: 0"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; stroke-width: 2"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
</div>
</div>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":900}}'>
const THREAD = {
  from: "Camille Roux", to: "vous, Inès Morel", when: "aujourd’hui 10:42", subject: "Atelier produit jeudi — ordre du jour",
  people: "Camille Roux, Inès Morel et vous",
  summary: "Atelier jeudi, 14 h – 16 h en salle Lumière : retours bêta, puis priorisation du trimestre. Camille attend votre confirmation avant mercredi soir.",
  actions: ["Confirmer ma présence", "Proposer un autre créneau"], attach: "synthese-retours-beta.pdf", attachSize: "1,2 Mo",
  earlier: [
    { id: "m1", from: "Inès Morel", when: "28 oct.", snippet: "Je pourrai être là à partir de 14 h, pas avant. On peut décaler ?", body: ["Je pourrai être là à partir de 14 h, pas avant. On peut décaler le début ?", "Inès"] },
    { id: "m2", from: "Vous", when: "28 oct.", snippet: "Parfait, on cale jeudi 14 h – 16 h en salle Lumière.", body: ["Parfait, on cale jeudi 14 h – 16 h en salle Lumière.", "Léo"] }
  ],
  body: ["Bonjour à tous,", "Voici l’ordre du jour proposé pour jeudi : revue des retours bêta (30 min), priorisation du trimestre (45 min), puis points divers.", "Pouvez-vous me confirmer votre présence d’ici mercredi soir ? Je joins la synthèse des retours.", "Camille"]
};
const initials = (name) => name === "Vous" ? "LM" : name.split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { expanded: null };
  }
  renderVals() {
    const s = this.state;
    const prev = THREAD.earlier;
    return {
      acctName: "Travail",
      acctShort: "T",
      acctColor: "#0F766E",
      r: {
        ...THREAD,
        ini: initials(THREAD.from),
        count: (prev.length + 1) + " messages",
        actions: THREAD.actions.map((a) => ({ label: a })),
        body: THREAD.body.map((p) => ({ text: p })),
        // older messages are stacked sheets: further back = narrower, partly hidden behind the next one
        earlier: prev.map((m, i) => {
          const open = s.expanded === m.id;
          return {
            ...m,
            ini: initials(m.from),
            isOpen: open,
            expanded: open ? "true" : "false",
            z: i + 1,
            inset: open ? 0 : (prev.length - i) * 12,
            gap: open ? 10 : -12,
            padB: open ? 16 : 22,
            snipOp: open ? 0 : 1,
            body: m.body.map((p) => ({ text: p })),
            toggle: () => this.setState({ expanded: s.expanded === m.id ? null : m.id })
          };
        })
      }
    };
  }
}
</script>
</body>
</html>
