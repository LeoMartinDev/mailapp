<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>A3 Matière — Reporter, sombre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;display=swap">
<style>
body{margin:0}
.app{--text:#EDEDEF;--text2:#A1A1AA;--acc:#2F6FEB;--accText:#82A9F3;--ring:#5B8FF5;--line:rgba(255,255,255,.08);color-scheme:dark}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:default}
input{font:inherit;color:inherit;margin:0}
input::placeholder{color:#8E8E97}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ell{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* dark: the dialog sits one step below the picked row (.opt.on), so that row can be lighter still */
.lift{background:linear-gradient(180deg,#1C1D21,#151619);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.6),0 2px 0 rgba(0,0,0,.45),0 18px 40px -14px rgba(0,0,0,.7)}
.well{background:rgba(0,0,0,.24);box-shadow:inset 0 1px 2px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:500;flex:none;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,opacity .16s ease}
.btn:active{transform:translateY(1px)}
.pri{background:linear-gradient(180deg,#3170E6,#265DCB);color:#FFFFFF;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 1px #1A3F8A,0 2px 0 #142F69,0 8px 18px -8px rgba(47,111,235,.6)}
.pri:hover{transform:translateY(-1px)}
.pri:active{transform:translateY(1px);box-shadow:inset 0 1px 2px rgba(0,0,0,.3),0 0 0 1px #1A3F8A}
.ib{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;color:var(--text2);flex:none;transition:background .15s,color .15s}
.ib:hover{background:rgba(255,255,255,.07);color:var(--text)}
/* option rows: the picked one gets the same max relief as a selected .r.on row */
.opt{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 9px 0 10px;box-sizing:border-box;border-radius:11px;text-align:left;white-space:nowrap;transition:background .2s ease,box-shadow .2s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
.opt:not(.on):hover{background:rgba(255,255,255,.045)}
.opt.on{background:linear-gradient(180deg,#232428,#1A1B1E);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(0,0,0,.6),0 2px 0 rgba(0,0,0,.45),0 10px 22px -12px rgba(0,0,0,.75)}
.opt:active{transform:scale(.99)}
.kh{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;font-size:11px;font-weight:550;color:var(--text2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);flex:none}
.opt.on .kh{color:var(--accText);box-shadow:inset 0 0 0 1px rgba(91,143,245,.45)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</helmet>
<div class="app" style="position: relative; width: 440px; height: 480px; overflow: hidden; background: #050506; color: var(--text); font-family: Inter, 'Segoe UI Variable Text', system-ui, -apple-system, sans-serif; font-optical-sizing: auto; font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased">

<span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(155deg, #0C1120 0%, #070709 50%, #0F0C18 100%)"></span>
<svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.07; mix-blend-mode: overlay; pointer-events: none"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>

<section role="dialog" aria-labelledby="rt" class="lift" style="position: absolute; top: 16px; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; border-radius: 16px; animation: pop .32s cubic-bezier(.2,.8,.2,1) both">

<header style="display: flex; align-items: flex-start; gap: 10px; padding: 14px 10px 0 18px">
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<h1 id="rt" style="display: flex; align-items: center; gap: 8px; margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: var(--accText)"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2"></path></svg>Reporter</h1>
<span class="ell" style="font-size: 12.5px; color: var(--text2)">Atelier produit jeudi — ordre du jour</span>
</div>
<button class="ib" aria-label="Fermer" title="Fermer · Échap" style="width: 28px; height: 28px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</header>

<div style="padding: 12px 12px 0">
<div class="well" style="display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 7px 0 12px; border-radius: 12px">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: var(--text2)"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg>
<label class="sr" for="when">Quand ?</label>
<input id="when" type="text" autocomplete="off" placeholder="Ex. demain 9h, lundi 14h" aria-describedby="parsed" value="{{text}}" onChange="{{onText}}" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; padding: 0; background: transparent; font-size: 14px; font-weight: 500">
<button class="btn pri" aria-disabled="{{dis}}" style="opacity: {{priOp}}">Reporter</button>
</div>
<p id="parsed" aria-live="polite" style="display: flex; align-items: center; gap: 7px; margin: 8px 0 0; padding: 0 12px; font-size: 12.5px; color: {{parsedColor}}; font-weight: {{parsedWeight}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 13px; height: 13px; color: {{parsedIcon}}"><path d="M5 5v6a3 3 0 0 0 3 3h11M15 10l4 4-4 4"></path></svg><span class="ell">{{parsed}}</span></p>
</div>

<div role="radiogroup" aria-label="Raccourcis" style="display: flex; flex-direction: column; gap: 2px; padding: 12px 8px 0">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button role="radio" aria-checked="{{o.checked}}" class="{{o.cls}}" title="{{o.title}}" onClick="{{o.pick}}">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: {{o.iconColor}}"><path d="{{o.icon}}"></path></svg>
<span style="flex: 1 1 auto; font-weight: 550">{{o.label}}</span>
<span style="font-size: 12.5px; color: var(--text2); font-variant-numeric: tabular-nums">{{o.value}}</span>
<span class="kh" aria-hidden="true">{{o.key}}</span>
</button>
</sc-for>
<span aria-hidden="true" style="height: 1px; margin: 4px 10px; background: var(--line)"></span>
<button class="opt">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: var(--text2)"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"></path></svg>
<span style="flex: 1 1 auto">Choisir une date et une heure…</span>
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 13px; height: 13px; color: var(--text2)"><path d="m9 6 6 6-6 6"></path></svg>
</button>
</div>

<p style="margin: auto 0 0; padding: 12px 18px 14px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.45; color: var(--text2)">
<sc-if value="{{ok}}" hint-placeholder-val="{{true}}">La conversation revient dans la Réception <span style="font-weight: 600; color: var(--text)">{{when}}</span>. D’ici là, vos autres appareils la voient dans « Reportés ».</sc-if>
<sc-if value="{{notOk}}" hint-placeholder-val="{{false}}">Exemples : « demain 9h », « lundi 14h », « ce soir », « week-end prochain ».</sc-if>
</p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":480}}'>
const NOW = new Date(2026, 9, 31, 10, 50); // samedi 31 octobre 2026, 10:50
const DAYS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MONTHS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const pad = (n) => (n < 10 ? "0" : "") + n;
const fmt = (d) => d ? DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()] + ", " + pad(d.getHours()) + ":" + pad(d.getMinutes()) : "";
// shortcut: knows day words and times only (not « 3 novembre »); the app’s real parser covers the rest
function parseWhen(text) {
  const t = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’']/g, " ");
  const tm = t.match(/(\d{1,2})\s*(?:h|:)\s*(\d{2})?/);
  let h = 9, m = 0, days = null;
  if (tm) {
    h = +tm[1];
    m = tm[2] ? +tm[2] : 0;
    if (h > 23 || m > 59) return null;
  }
  if (/apres[- ]demain/.test(t)) days = 2;
  else if (/demain/.test(t)) days = 1;
  else if (/aujourd|ce soir|plus tard/.test(t)) { days = 0; if (!tm) h = 18; }
  else if (/week[- ]?end/.test(t)) days = (6 - NOW.getDay() + 6) % 7 + 1;
  else {
    const d = DAYS.findIndex((n) => t.indexOf(n) >= 0);
    if (d >= 0) days = (d - NOW.getDay() + 6) % 7 + 1;
    else if (tm) days = 0;
  }
  if (days === null) return null;
  return new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() + days, h, m);
}
console.assert(fmt(parseWhen("demain 9h")) === "dimanche 1 novembre, 09:00", "demain 9h");
console.assert(fmt(parseWhen("lundi 9h")) === "lundi 2 novembre, 09:00", "lundi 9h");
console.assert(fmt(parseWhen("week-end prochain")) === "samedi 7 novembre, 09:00", "week-end prochain");
console.assert(fmt(parseWhen("aujourd’hui 18h")) === "samedi 31 octobre, 18:00", "aujourd’hui 18h");
console.assert(parseWhen("le 3") === null, "texte non reconnu");
const OPTS = [
  { key: "1", label: "Plus tard aujourd’hui", value: "18:00", phrase: "aujourd’hui 18h", icon: "M3 18h18M7 14a5 5 0 0 1 10 0M12 4v3M4.9 7.9l1.4 1.4M19.1 7.9l-1.4 1.4" },
  { key: "2", label: "Demain matin", value: "dim. 1 nov., 09:00", phrase: "demain 9h", icon: "M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" },
  { key: "3", label: "Lundi", value: "2 nov., 09:00", phrase: "lundi 9h", icon: "M4 8h16v11H4zM9 8V5h6v3M4 13h16" },
  { key: "4", label: "Week-end prochain", value: "sam. 7 nov., 09:00", phrase: "week-end prochain", icon: "M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v5H3zM5 18v2M19 18v2" }
].map((o) => ({ ...o, at: parseWhen(o.phrase) }));
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { text: "demain 9h" };
  }
  renderVals() {
    const text = this.state.text;
    const at = parseWhen(text);
    const ok = !!at && at > NOW;
    const parsed = ok ? fmt(at) : !text.trim() ? "Indiquez un jour et une heure" : at ? "Ce moment est déjà passé" : "Date non reconnue";
    return {
      text,
      onText: (e) => this.setState({ text: e.target.value }),
      parsed,
      parsedColor: ok ? "var(--text)" : "var(--text2)",
      parsedWeight: ok ? 550 : 400,
      parsedIcon: ok ? "var(--accText)" : "var(--text2)",
      ok,
      notOk: !ok,
      when: ok ? fmt(at).replace(", ", " à ") : "",
      dis: ok ? "false" : "true",
      priOp: ok ? 1 : 0.5,
      // the highlighted row is whichever shortcut lands on the same moment as the typed text
      opts: OPTS.map((o) => {
        const on = ok && at.getTime() === o.at.getTime();
        return {
          ...o,
          cls: on ? "opt on" : "opt",
          checked: on ? "true" : "false",
          iconColor: on ? "var(--accText)" : "var(--text2)",
          title: "Raccourci : " + o.key,
          pick: () => this.setState({ text: o.phrase })
        };
      })
    };
  }
}
</script>
</body>
</html>
